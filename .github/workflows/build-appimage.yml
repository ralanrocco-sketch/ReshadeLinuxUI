name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and bundled helper tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip p7zip-full curl git grep file libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0
      - name: Download linuxdeploy
        run: |
          curl -L --fail --retry 3 -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
      - name: Build
        run: APPIMAGE_EXTRACT_AND_RUN=1 LINUXDEPLOY="$PWD/linuxdeploy-x86_64.AppImage" bash packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reshade-linux-gui-appimage
          path: ReShade-Linux-GUI-x86_64.AppImage
          if-no-files-found: error
